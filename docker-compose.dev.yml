version: '3.8'

services:
  # Neon Local - PostgreSQL proxy for development with ephemeral branches
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: acquisitions-neon-local
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      # Optional: Persist branch metadata per Git branch
      - ./.neon_local/:/tmp/.neon_local
      - ./.git/HEAD:/tmp/.git/HEAD:ro
    networks:
      - acquisitions-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acquisitions-app-dev
    ports:
      - "3000:3000"
    environment:
      # Load development environment variables
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      # Connect to Neon Local using standard Postgres connection string
      DATABASE_URL: postgres://neon:npg@neon-local:5432/${NEON_DATABASE_NAME}?sslmode=require
      JWT_SECRET: ${JWT_SECRET_DEV:-dev_jwt_secret_change_in_production}
      ARCJET_KEY: ${ARCJET_KEY_DEV:-ajkey_test_dev_mode}
      CORS_ORIGIN: ${CORS_ORIGIN_DEV:-http://localhost:3000,http://localhost:3001}
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      - ./package*.json:/app/
      # Mount logs directory
      - ./logs:/app/logs
    depends_on:
      neon-local:
        condition: service_healthy
    networks:
      - acquisitions-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Database management tool
  adminer:
    image: adminer:4-standalone
    container_name: acquisitions-adminer-dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: neon-local
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - neon-local
    networks:
      - acquisitions-network
    profiles:
      - tools

networks:
  acquisitions-network:
    driver: bridge

volumes:
  neon_local_data:
    driver: local