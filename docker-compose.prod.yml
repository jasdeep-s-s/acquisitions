version: '3.8'

services:
  # Main application - Production
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acquisitions-app-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Only mount logs for production
      - ./logs:/app/logs
      # Optional: Mount custom config files
      - ./config/production:/app/config:ro
    restart: unless-stopped
    networks:
      - acquisitions-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Limit resources
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Optional: Monitoring and logging sidecar
  log-shipper:
    image: fluent/fluent-bit:latest
    container_name: acquisitions-log-shipper
    volumes:
      - ./logs:/var/log/app:ro
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - app
    networks:
      - acquisitions-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Optional: Reverse proxy/Load balancer
  nginx:
    image: nginx:alpine
    container_name: acquisitions-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - acquisitions-network
    profiles:
      - proxy
    restart: unless-stopped

networks:
  acquisitions-network:
    driver: bridge